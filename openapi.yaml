openapi: 3.0.3
info:
  title: ZHAC REST API
  version: 0.4.0
  description: |
    REST API of the ZHAC hub firmware (zhac-wired-core). REST_API.md is the reference text;
    this file follows it.

    While sign-in is on, every route except `GET /api/status`, `POST /api/auth/login` and
    `POST /api/auth/setup` needs the `X-Api-Key` header (401 `unauthorized` without it).
    With sign-in off no token is needed, but a request from another site's page, or through
    a host name that is not the hub's, is refused (403 `cross_site`).
servers:
  - url: http://{host}
    variables:
      host:
        default: zhac.local
        description: Device IP or mDNS hostname
security:
  - ApiKey: []

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-Api-Key

  responses:
    Reason:
      description: Refused; the reason in the body (for example `missing ieee`)
      content:
        text/plain:
          schema: { type: string }
    CrossSite:
      description: Sign-in off, and the request came from another site's page (`cross_site`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  parameters:
    RuleId:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1, maximum: 65535 }
    ScriptName:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,24}$' }

  schemas:
    Ok:
      type: object
      properties:
        ok: { type: boolean, example: true }
      required: [ok]

    Error:
      type: object
      properties:
        error: { type: string }

    Token:
      type: object
      properties:
        ok:    { type: boolean }
        token: { type: string, description: 32 hex digits }

    Password:
      type: object
      required: [password]
      properties:
        password: { type: string, minLength: 8, maxLength: 63 }

    IeeeBody:
      type: object
      required: [ieee]
      properties:
        ieee: { type: string, example: "0x00158D0001020304" }

    IdBody:
      type: object
      required: [id]
      properties:
        id: { type: integer }

    Settings:
      type: object
      description: Every field optional; send only what changes.
      properties:
        broker_url:              { type: string, example: "mqtt://192.168.1.10:1883" }
        mqtt_enabled:            { type: boolean }
        mqtt_client_id:          { type: string }
        mqtt_root_topic:         { type: string }
        mqtt_tls_pin:            { type: string, description: "SHA-256 fingerprint of the broker's certificate (64 hex digits); empty removes it" }
        ha_discovery:            { type: boolean }
        ha_prefix:               { type: string }
        ntp_server:              { type: string, maxLength: 63, description: "Empty for pool.ntp.org" }
        timezone:                { type: string, example: "CET-1CEST,M3.5.0,M10.5.0/3" }
        auth_enabled:            { type: boolean }
        ap_disabled:             { type: boolean }
        metrics_enabled:         { type: boolean }
        metrics_mqtt_enabled:    { type: boolean }
        metrics_mqtt_interval_s: { type: integer }
        log_mqtt_enabled:        { type: boolean, description: Until the next restart }
        log_mqtt_level:          { type: string, enum: [E, W, I, D, V] }
        log_ws_enabled:          { type: boolean, description: Until the next restart }
        log_ws_level:            { type: string, enum: [E, W, I, D, V] }
        remote_scripts:          { type: boolean }
        log_to_cloud:            { type: boolean }

    Device:
      type: object
      properties:
        ieee:         { type: string, example: "0x00158D0001020304" }
        nwk:          { type: integer, example: 4660 }
        friendly:     { type: string, example: front_door }
        model:        { type: string, description: "From the matched definition, else the device's own string" }
        vendor:       { type: string }
        manufacturer: { type: string }
        model_id:     { type: string }
        last_seen:    { type: integer, description: "Unix time of the last frame; 0 while unknown" }
        lqi:          { type: integer, minimum: 0, maximum: 255 }
        battery:      { type: integer, description: Percent }
        power_source: { type: integer, description: ZCL Basic power source }
        ep_count:     { type: integer }
        endpoints:    { type: array, items: { type: integer } }
        attrs:        { type: object, additionalProperties: true }

    Collection:
      type: object
      properties:
        id:      { type: integer }
        name:    { type: string }
        members:
          type: array
          items:
            type: object
            properties:
              ieee: { type: string }
              ep:   { type: integer, default: 1 }

    Rule:
      type: object
      properties:
        id:           { type: integer, minimum: 1, maximum: 65535 }
        enabled:      { type: boolean }
        trigger_type: { type: integer }
        rule_type:    { type: integer }
        name:         { type: string }
        dsl:          { type: string }

    Script:
      type: object
      properties:
        name: { type: string, example: motion }
        size: { type: integer, description: Source size in bytes }

    IoState:
      type: object
      properties:
        target:   { type: string, example: esp32p4 }
        adc_unit: { type: string }
        max:      { type: integer }
        allowed:  { type: array, items: { type: integer } }
        adc_pins: { type: array, items: { type: integer } }
        pins:     { type: array, items: { type: object, additionalProperties: true } }

paths:
  /api/status:
    get:
      summary: The hub's state
      description: |
        With sign-in on, a request without the token gets only `sku` and the `auth_*` fields.
        The WebSocket `status` command answers the same object. REST_API.md lists every field.
      operationId: getStatus
      security: [{}, { ApiKey: [] }]
      responses:
        '200':
          description: The status object
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  sku:                  { type: string, example: wired }
                  fw_version:           { type: string }
                  uptime_s:             { type: integer }
                  ip:                   { type: string }
                  hostname:             { type: string }
                  zigbee_ok:            { type: boolean }
                  device_count:         { type: integer }
                  ota_state:            { type: string, description: "pending while a new firmware is on trial; verified once kept" }
                  auth_enabled:         { type: boolean }
                  auth_setup_required:  { type: boolean }
                  auth_setup_secs_left: { type: integer }
                  auth_storage_error:   { type: boolean }
                  storage_error:        { type: boolean }
                  full_backup:          { type: boolean }
                  device_ota:           { type: boolean }
        '403': { $ref: '#/components/responses/CrossSite' }
        '500': { $ref: '#/components/responses/Reason' }

  /api/settings:
    post:
      summary: Update settings
      description: The WebSocket `settings.set` takes the same object.
      operationId: postSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Settings' }
      responses:
        '200':
          description: Applied at once, no restart
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/Reason' }

  /api/token/rotate:
    post:
      summary: Replace the API token
      description: Also at `POST /api/system/token/rotate`.
      operationId: postTokenRotate
      responses:
        '200':
          description: The new token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '500': { $ref: '#/components/responses/Reason' }

  /api/logs:
    get:
      summary: Recent log lines, oldest first
      operationId: getLogs
      responses:
        '200':
          description: Each line prefixed with its time in milliseconds
          content:
            application/json:
              schema:
                type: object
                properties:
                  logs: { type: array, items: { type: string } }
        '500': { $ref: '#/components/responses/Reason' }

  /api/diagnostics/unhandled:
    get:
      summary: Zigbee messages no device definition handled
      operationId: getUnhandled
      responses:
        '200':
          description: One entry per device, cluster and attribute or command
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        ieee:    { type: string }
                        cluster: { type: integer }
                        id:      { type: integer, description: Attribute or command id }
                        cs:      { type: boolean, description: A cluster-specific command }
                        count:   { type: integer }
                        age_s:   { type: integer, description: Seconds since the last one }

  /api/auth/login:
    post:
      summary: Exchange the admin password for the API token
      operationId: postAuthLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Password' }
      responses:
        '200':
          description: The token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '401': { description: wrong_password }
        '409': { description: No password set yet }
        '415': { description: json_required }
        '429': { description: "too_many_attempts (Retry-After: 60)" }

  /api/auth/setup:
    post:
      summary: Set the first admin password and get the token
      description: Open only while no password exists, and for 10 minutes after power-on.
      operationId: postAuthSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Password' }
      responses:
        '200':
          description: The token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '400': { description: password must be 8-63 characters }
        '403': { description: already_set or setup_closed (power-cycle the hub to reopen the window) }
        '415': { description: json_required }
        '503': { description: storage_error }

  /api/auth/password:
    post:
      summary: Change the admin password
      description: Rotates the API token, which signs other clients out, and returns the new one.
      operationId: postAuthPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current, new]
              properties:
                current: { type: string }
                new:     { type: string, minLength: 8, maxLength: 63 }
      responses:
        '200':
          description: The new token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '400': { description: password must be 8-63 characters }
        '401': { description: wrong_password }
        '415': { description: json_required }
        '429': { description: "too_many_attempts (Retry-After: 60)" }

  /api/net/status:
    get:
      summary: The Ethernet link and address
      operationId: getNetStatus
      responses:
        '200':
          description: Link state
          content:
            application/json:
              schema:
                type: object
                properties:
                  transport:  { type: string, enum: [ethernet] }
                  link_up:    { type: boolean }
                  has_ip:     { type: boolean }
                  ip:         { type: string }
                  netmask:    { type: string }
                  gateway:    { type: string }
                  mac:        { type: string }
                  speed_mbps: { type: integer }
                  duplex:     { type: string, enum: [full, half] }
                  hostname:   { type: string }

  /api/wifi/status:
    get:
      summary: A compatibility answer for older clients; the hub is Ethernet-only
      description: Also at `GET /api/wifi`.
      operationId: getWifiStatus
      responses:
        '200':
          description: "`mode` is `eth`; the SSID fields are empty"
          content:
            application/json:
              schema: { type: object, additionalProperties: true }

  /api/wifi/scan:
    get:
      summary: Always an empty list
      operationId: getWifiScan
      responses:
        '200':
          description: No networks
          content:
            application/json:
              schema:
                type: object
                properties:
                  networks: { type: array, items: { type: object }, maxItems: 0 }

  /api/wifi/connect:
    post:
      summary: Not supported; configure the network on your router
      description: The same answer at `POST /api/wifi/disconnect` and `POST /api/wifi`.
      operationId: postWifiConnect
      responses:
        '501':
          description: wifi_unsupported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/devices:
    get:
      summary: Every device
      description: Also at `GET /api/device/list`.
      operationId: getDevices
      responses:
        '200':
          description: One object per device
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }

  /api/device/attr/set:
    post:
      summary: Write one value to a device
      description: |
        Also at `POST /api/device_state`. `value` may be a boolean, an integer, a decimal (the
        device's converter scales it) or a string (an enum option).
      operationId: postDeviceAttrSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ieee, key, value]
              properties:
                ieee:  { type: string }
                key:   { type: string, example: state }
                value: { description: "A boolean, number or string" }
      responses:
        '200':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/Reason' }
        '404': { $ref: '#/components/responses/Reason' }
        '500': { $ref: '#/components/responses/Reason' }

  /api/device/options/set:
    post:
      summary: Save device options, merged into what is stored
      description: Also at `POST /api/device/options`. The options are `occupancy_timeout` and `no_occupancy_since`.
      operationId: postDeviceOptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ieee]
              additionalProperties: true
              properties:
                ieee: { type: string }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { $ref: '#/components/responses/Reason' }
        '500': { $ref: '#/components/responses/Reason' }

  /api/device/reinterview:
    post:
      summary: Interview a device again, then run its bindings, reporting setup and first reads
      operationId: postDeviceReinterview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IeeeBody' }
      responses:
        '200':
          description: "`ok` false with `err` `unknown or sleepy` for a device the hub does not know or that sleeps"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:  { type: boolean }
                  err: { type: string }
        '400': { $ref: '#/components/responses/Reason' }

  /api/device/configure:
    post:
      summary: Run a device's bindings, reporting setup and first reads again
      operationId: postDeviceConfigure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IeeeBody' }
      responses:
        '200':
          description: Queued
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:     { type: boolean }
                  queued: { type: boolean }
        '400': { $ref: '#/components/responses/Reason' }
        '404': { description: Unknown or never interviewed }

  /api/permit_join:
    post:
      summary: Open the Zigbee network for new devices
      description: Also at `POST /api/zigbee/permit_join`.
      operationId: postPermitJoin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration]
              properties:
                duration: { type: integer, minimum: 0, maximum: 254, description: "Seconds; 0 closes it", example: 254 }
      responses:
        '200':
          description: Open for that long
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:       { type: boolean }
                  duration: { type: integer }
        '400': { $ref: '#/components/responses/Reason' }
        '500': { $ref: '#/components/responses/Reason' }

  /api/groups:
    get:
      summary: Every collection of devices
      operationId: getGroups
      responses:
        '200':
          description: The collections
          content:
            application/json:
              schema:
                type: object
                properties:
                  groups: { type: array, items: { $ref: '#/components/schemas/Collection' } }
    post:
      summary: Create a collection
      operationId: postGroups
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:    { type: string }
                members: { type: array, items: { type: object, properties: { ieee: { type: string }, ep: { type: integer, default: 1 } } } }
      responses:
        '200':
          description: The new collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '500': { description: create failed }

  /api/group/get:
    post:
      summary: One collection
      operationId: postGroupGet
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdBody' }
      responses:
        '200':
          description: The collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '404': { description: no such group }

  /api/group/update:
    post:
      summary: Rename a collection or replace its members; a field left out stays
      operationId: postGroupUpdate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:      { type: integer }
                name:    { type: string }
                members: { type: array, items: { type: object, properties: { ieee: { type: string }, ep: { type: integer } } } }
      responses:
        '200':
          description: The collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '404': { description: no such group }

  /api/group/delete:
    post:
      summary: Delete a collection
      operationId: postGroupDelete
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdBody' }
      responses:
        '200':
          description: "`ok` false when there is no such collection"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }

  /api/group/cmd:
    post:
      summary: Send a command to every member
      description: |
        `{"id":1,"val":"ON"}` (`key` defaults to `state`), `{"id":1,"cluster":6,"cmd":1}`
        (On/Off: 0 Off, 1 On, 2 Toggle; cluster 3 command 0 is Identify), or any value with `key`.
      operationId: postGroupCmd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id:      { type: integer }
                cluster: { type: integer }
                cmd:     { type: integer }
                key:     { type: string, default: state }
                val:     { description: "A boolean, number or string" }
      responses:
        '200':
          description: "`sent` and `failed` count members; `ok` false with `err` when refused"
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:     { type: boolean }
                  sent:   { type: integer }
                  failed: { type: integer }
                  err:    { type: string }

  /api/rules:
    get:
      summary: Every rule
      operationId: getRules
      responses:
        '200':
          description: The rules
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rule' }
    post:
      summary: Create a rule
      operationId: postRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dsl]
              properties:
                name:    { type: string }
                dsl:     { type: string, example: "ON front_door#contact=0 DO zigbee.set lamp state 1 ENDON" }
                enabled: { type: boolean, nullable: true, description: "Absent or null: On" }
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:      { type: boolean }
                  id:      { type: integer }
                  enabled: { type: boolean }
        '400': { description: "missing dsl, enabled must be true or false, or the parser's refusal as {ok: false, err}" }

  /api/rules/{id}:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    put:
      summary: Replace a rule's name and text
      operationId: putRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dsl]
              properties:
                name: { type: string }
                dsl:  { type: string }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { description: "bad id, or the parser's refusal" }
    delete:
      summary: Delete a rule
      operationId: deleteRule
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '404': { description: rule not found }

  /api/rules/{id}/enable:
    parameters:
      - $ref: '#/components/parameters/RuleId'
    post:
      summary: Switch a rule on or off
      operationId: postRuleEnable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: Switched
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '404': { description: rule not found }

  /api/scripts:
    get:
      summary: Every Lua script
      operationId: getScripts
      responses:
        '200':
          description: Name and size of each
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Script' }

  /api/scripts/{name}:
    parameters:
      - $ref: '#/components/parameters/ScriptName'
    get:
      summary: A script's source
      operationId: getScript
      responses:
        '200':
          description: The source
          content:
            text/plain:
              schema: { type: string }
        '400': { description: bad name }
        '404': { description: not found }
    put:
      summary: Create or overwrite a script; the body is the raw Lua source
      operationId: putScript
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, maxLength: 16384 }
      responses:
        '200':
          description: Stored; Apply on the Scripts page (or a restart) loads it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { description: bad name, or the body did not arrive in full }
        '408': { description: The body timed out }
        '411': { description: A chunked upload (send Content-Length) }
        '413': { description: Over 16384 bytes }
        '500': { description: write failed }
    post:
      summary: The same as PUT
      operationId: postScript
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, maxLength: 16384 }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
    delete:
      summary: Delete a script
      operationId: deleteScript
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '404': { description: not found }

  /api/scripts/{name}/run:
    parameters:
      - $ref: '#/components/parameters/ScriptName'
    post:
      summary: Queue a run of the script on the Lua task
      operationId: postScriptRun
      responses:
        '200':
          description: Queued; runtime errors go to the log
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:     { type: boolean }
                  queued: { type: boolean }
        '500': { description: "queue saturated or missing, or scripts are held" }

  /api/scripts/{name}/check:
    parameters:
      - $ref: '#/components/parameters/ScriptName'
    post:
      summary: Check a source without saving it; the body is the source
      operationId: postScriptCheck
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string, maxLength: 16384 }
      responses:
        '200':
          description: The parser's verdict
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:   { type: boolean }
                  err:  { type: string }
                  line: { type: integer }

  /api/io:
    get:
      summary: The hub board's own pins (GPIO.md)
      operationId: getIo
      responses:
        '200':
          description: The pins the board allows, the analog ones, and each configured pin with its value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IoState' }
    put:
      summary: Replace the pin configuration
      operationId: putIo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pins]
              properties:
                pins: { type: array, items: { type: object, additionalProperties: true } }
      responses:
        '200':
          description: The new state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IoState' }
        '400':
          description: A configuration the hub refuses, or a body of 4 KB or more
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/remote/status:
    get:
      summary: The link to ZHAC Cloud
      operationId: getRemoteStatus
      responses:
        '200':
          description: Link state; the token is never in the reply
          content:
            application/json:
              schema:
                type: object
                properties:
                  enabled:         { type: boolean }
                  state:           { type: string }
                  connected_since: { type: integer }
                  last_event_at:   { type: integer }
                  rtt_ms:          { type: integer }
                  tx_drops:        { type: integer }
                  auth_fails:      { type: integer }
                  log_sent:        { type: integer }
                  log_dropped:     { type: integer }

  /api/remote/connect:
    post:
      summary: Store the cloud's address and the hub's token, and connect
      operationId: postRemoteConnect
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, token]
              properties:
                url:       { type: string, example: "wss://cloud.example/hub" }
                token:     { type: string }
                device_id: { type: string, description: Empty keeps the stored one }
      responses:
        '200':
          description: Connecting
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400': { description: url + token required }

  /api/remote/disconnect:
    post:
      summary: Drop the link; forget also erases the stored address and token
      operationId: postRemoteDisconnect
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                forget: { type: boolean }
      responses:
        '200':
          description: Dropped
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:     { type: boolean }
                  forget: { type: boolean }

  /api/backup/full:
    post:
      summary: Download a full backup of the hub, encrypted with the given password
      operationId: postBackupFull
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: "8 to 63 bytes (UTF-8)" }
      responses:
        '200':
          description: The .zhacbak file (about 3.2 MB); a cut-off transfer means the backup failed
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400':
          description: password_length
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '415':
          description: json_required
        '500':
          description: partition_missing, crypto
        '503':
          description: busy (the storage kept changing), no_memory

  /api/backup/restore:
    post:
      summary: Restore a full backup onto this hub, then restart
      description: >-
        Body = the password's length in bytes (u16, little-endian), the password (UTF-8), then the file. Checked
        before anything is written; staged in the idle firmware slot and written over the storage at the next boot.
      operationId: postBackupRestore
      security: [{ ApiKey: [] }]
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Staged; the hub restarts to apply it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ok' }
        '400':
          description: not_a_backup, password_length, wrong_password, incomplete, damaged
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '409':
          description: >-
            partitions_differ (with `partition`), newer_firmware (with `fw`), on_trial, update_running
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '415':
          description: octet_stream_required
        '500':
          description: no_space, flash, crypto
        '503':
          description: no_memory

  /api/device/ota:
    post:
      summary: Update one Zigbee device's firmware with an uploaded OTA file
      description: >-
        The hub checks the file (OTA header from the start; vendor prefixes and trailing bytes allowed), holds it in
        memory, serves it through its OTA Upgrade server to this device only and sends it an Image Notify. One update
        at a time.
      operationId: postDeviceOta
      security: [{ ApiKey: [] }]
      parameters:
        - { name: ieee, in: query, required: true, schema: { type: string, example: "0x00158D0001020304" } }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: Loaded; the device was told to ask
          content:
            application/json:
              schema:
                type: object
                properties:
                  manuf: { type: integer }
                  image_type: { type: integer }
                  file_version: { type: integer }
                  size: { type: integer }
        '400':
          description: no_device, not_an_ota_file, incomplete
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
        '404':
          description: unknown_device
        '409':
          description: busy (another update runs), radio_down
        '413':
          description: too_large (over 4 MB)
        '415':
          description: octet_stream_required
        '503':
          description: radio_busy, no_memory
    get:
      summary: The device firmware update the hub runs
      operationId: getDeviceOta
      security: [{ ApiKey: [] }]
      responses:
        '200':
          description: >-
            {"state":"idle"}, or state (waiting, sending, done, failed, cancelled), ieee, manuf, image_type,
            file_version, size, offset, pct, fits, reason (same_version, device_newer, device_status, device_aborted, device_silent, device_left),
            device_status, elapsed_s, and once the device asked device_manuf, device_image_type, device_version
          content:
            application/json:
              schema: { type: object }

  /api/device/ota/cancel:
    post:
      summary: Stop the device firmware update; the device keeps its firmware
      operationId: postDeviceOtaCancel
      security: [{ ApiKey: [] }]
      responses:
        '200':
          description: The state after the cancel (as GET /api/device/ota)
          content:
            application/json:
              schema: { type: object }
